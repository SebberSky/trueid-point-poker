<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrueID — Portal</title>
    <meta name="description" content="TrueID internal apps on agent3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0c1222;
        --fog: #e8eef6;
        --red: #c8102e;
        --teal: #1a9b8e;
        --sand: #d4a574;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        height: 100%;
      }

      body {
        font-family: Manrope, system-ui, sans-serif;
        color: var(--fog);
        background: var(--ink);
        overflow: hidden;
      }

      .portal {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(7rem, 18vh) 1fr;
        width: 100%;
        height: 100dvh;
        min-height: 100vh;
      }

      .brand {
        grid-column: 1 / -1;
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1.5rem;
        padding: clamp(1.25rem, 3vw, 2.5rem) clamp(1.5rem, 4vw, 3.5rem);
        background:
          radial-gradient(120% 180% at 8% 120%, rgba(200, 16, 46, 0.35), transparent 55%),
          radial-gradient(80% 120% at 92% 0%, rgba(26, 155, 142, 0.22), transparent 50%),
          linear-gradient(105deg, #0a0f1a 0%, #121a2e 48%, #0d1524 100%);
        isolation: isolate;
        overflow: hidden;
      }

      .brand::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(232, 238, 246, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(232, 238, 246, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
        opacity: 0.5;
        pointer-events: none;
        animation: grid-drift 28s linear infinite;
      }

      .brand__mark {
        position: relative;
        font-family: Syne, sans-serif;
        font-weight: 800;
        font-size: clamp(2.6rem, 7vw, 5.2rem);
        letter-spacing: -0.055em;
        line-height: 0.9;
        z-index: 1;
      }

      .brand__mark span {
        color: var(--red);
      }

      .brand__aside {
        position: relative;
        z-index: 1;
        max-width: 16rem;
        text-align: right;
        font-size: 0.95rem;
        font-weight: 500;
        line-height: 1.45;
        color: rgba(232, 238, 246, 0.72);
        animation: fade-up 0.9s var(--ease) both;
      }

      .tile {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: clamp(1.5rem, 4vw, 3rem);
        text-decoration: none;
        color: inherit;
        overflow: hidden;
        isolation: isolate;
        min-height: 0;
        transition: transform 0.55s var(--ease);
      }

      .tile:focus-visible {
        outline: 3px solid var(--fog);
        outline-offset: -3px;
        z-index: 2;
      }

      .tile__bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        transform: scale(1.04);
        transition: transform 0.8s var(--ease), filter 0.8s var(--ease);
      }

      .tile:hover .tile__bg,
      .tile:focus-visible .tile__bg {
        transform: scale(1.1);
        filter: saturate(1.08) brightness(1.05);
      }

      .tile--office .tile__bg {
        background:
          radial-gradient(ellipse 70% 55% at 70% 20%, rgba(255, 255, 255, 0.35), transparent 60%),
          linear-gradient(180deg, #7eb3d4 0%, #9bc4db 40%, #5f9e4e 40.2%, #4d8a3f 100%);
      }

      .tile--office .tile__bg::before {
        content: '';
        position: absolute;
        inset: 38% 0 0 0;
        background-image:
          linear-gradient(rgba(20, 50, 20, 0.12) 2px, transparent 2px),
          linear-gradient(90deg, rgba(20, 50, 20, 0.12) 2px, transparent 2px);
        background-size: 36px 36px;
        opacity: 0.55;
      }

      .tile--office .tile__bg::after {
        content: '';
        position: absolute;
        left: 12%;
        bottom: 18%;
        width: min(42%, 280px);
        aspect-ratio: 1;
        background:
          linear-gradient(135deg, #c8102e 0 18%, transparent 18% 22%, #0f172a 22% 40%, transparent 40% 44%, #e8eef6 44% 55%, transparent 55%),
          linear-gradient(180deg, #8eb8d8 0%, #6a9fc0 100%);
        clip-path: polygon(20% 100%, 20% 35%, 35% 35%, 35% 18%, 65% 18%, 65% 35%, 80% 35%, 80% 100%);
        box-shadow: 10px 14px 0 rgba(15, 23, 42, 0.18);
        animation: rise 1.1s var(--ease) 0.15s both;
      }

      .tile--poker .tile__bg {
        background:
          radial-gradient(circle at 22% 30%, rgba(212, 165, 116, 0.35), transparent 42%),
          radial-gradient(circle at 78% 70%, rgba(200, 16, 46, 0.4), transparent 45%),
          linear-gradient(145deg, #1a0b2e 0%, #2a1248 42%, #12081f 100%);
      }

      .tile--poker .tile__bg::before {
        content: '';
        position: absolute;
        inset: -20%;
        background:
          repeating-conic-gradient(from 12deg at 50% 50%, rgba(232, 238, 246, 0.045) 0 8deg, transparent 8deg 18deg);
        animation: spin-slow 60s linear infinite;
      }

      .tile--poker .tile__bg::after {
        content: '♠︎';
        position: absolute;
        right: 8%;
        bottom: 12%;
        font-size: clamp(6rem, 18vw, 12rem);
        line-height: 1;
        color: rgba(232, 238, 246, 0.12);
        font-family: Syne, sans-serif;
        transform: rotate(-12deg);
        animation: float-card 5.5s ease-in-out infinite;
      }

      .tile__copy {
        position: relative;
        z-index: 1;
        max-width: 22rem;
        animation: fade-up 0.85s var(--ease) both;
      }

      .tile--poker .tile__copy {
        animation-delay: 0.12s;
      }

      .tile__eyebrow {
        display: inline-block;
        margin-bottom: 0.65rem;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
      }

      .tile--office .tile__eyebrow {
        color: rgba(15, 23, 42, 0.65);
      }

      .tile__title {
        font-family: Syne, sans-serif;
        font-weight: 800;
        font-size: clamp(2.4rem, 6vw, 4.4rem);
        letter-spacing: -0.045em;
        line-height: 0.95;
        margin-bottom: 0.75rem;
      }

      .tile--office .tile__title {
        color: #0f172a;
        text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.28);
      }

      .tile__blurb {
        font-size: 1.02rem;
        font-weight: 500;
        line-height: 1.45;
        margin-bottom: 1.35rem;
        color: rgba(255, 255, 255, 0.78);
      }

      .tile--office .tile__blurb {
        color: rgba(15, 23, 42, 0.78);
      }

      .tile__go {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        font-family: Syne, sans-serif;
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: -0.02em;
      }

      .tile__go::after {
        content: '→';
        transition: transform 0.35s var(--ease);
      }

      .tile:hover .tile__go::after,
      .tile:focus-visible .tile__go::after {
        transform: translateX(6px);
      }

      .tile--office .tile__go {
        color: var(--red);
      }

      .tile--poker .tile__go {
        color: var(--sand);
      }

      @keyframes grid-drift {
        from {
          background-position: 0 0, 0 0;
        }
        to {
          background-position: 48px 48px, 48px 48px;
        }
      }

      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes float-card {
        0%,
        100% {
          transform: rotate(-12deg) translateY(0);
        }
        50% {
          transform: rotate(-8deg) translateY(-12px);
        }
      }

      @keyframes spin-slow {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 820px) {
        body {
          overflow: auto;
        }

        .portal {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(52vh, auto) minmax(52vh, auto);
          height: auto;
          min-height: 100dvh;
        }

        .brand {
          align-items: flex-start;
          flex-direction: column;
          padding-top: 1.75rem;
          padding-bottom: 1.75rem;
        }

        .brand__aside {
          text-align: left;
          max-width: none;
        }

        .tile--poker .tile__bg::after {
          font-size: 7rem;
          opacity: 0.9;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="portal">
      <header class="brand">
        <h1 class="brand__mark">True<span>ID</span></h1>
        <p class="brand__aside">Internal tools on agent3 — pick a workspace.</p>
      </header>

      <a class="tile tile--office" href="/office/">
        <div class="tile__bg" aria-hidden="true"></div>
        <div class="tile__copy">
          <p class="tile__eyebrow">Virtual workspace</p>
          <h2 class="tile__title">Office</h2>
          <p class="tile__blurb">เดินคุย แชร์จอ ในออฟฟิศบล็อกสำหรับทีม TrueID</p>
          <span class="tile__go">Enter office</span>
        </div>
      </a>

      <a class="tile tile--poker" href="/poker/">
        <div class="tile__bg" aria-hidden="true"></div>
        <div class="tile__copy">
          <p class="tile__eyebrow">Planning poker</p>
          <h2 class="tile__title">Point Poker</h2>
          <p class="tile__blurb">Realtime story-point voting ผูกกับ Jira boards ของทีม</p>
          <span class="tile__go">Start voting</span>
        </div>
      </a>
    </main>
  </body>
</html>
