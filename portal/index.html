<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrueID — Portal</title>
    <meta name="description" content="TrueID internal apps on agent3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="./assets/tatang-still.png" as="image" />
    <link rel="preload" href="./assets/tatang-logo.json" as="fetch" crossorigin />
    <link rel="preload" href="./assets/lottie.min.js" as="script" />
    <style>
      :root {
        --void: #07010f;
        --mist: #f3e8ff;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        min-height: 100%;
      }

      body {
        font-family: Outfit, system-ui, sans-serif;
        color: var(--mist);
        background: var(--void);
        overflow: hidden;
      }

      .space {
        position: relative;
        width: 100%;
        height: 100dvh;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(ellipse 90% 70% at 18% 25%, rgba(139, 92, 246, 0.28), transparent 55%),
          radial-gradient(ellipse 80% 60% at 82% 70%, rgba(200, 16, 46, 0.32), transparent 52%),
          radial-gradient(ellipse 50% 40% at 50% 50%, rgba(42, 6, 64, 0.9), transparent 70%),
          linear-gradient(160deg, #05010c 0%, #12041f 45%, #1a0518 100%);
      }

      .stars,
      .stars-2 {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-repeat: repeat;
        opacity: 0.55;
      }

      .stars {
        background-image:
          radial-gradient(1.5px 1.5px at 12% 18%, rgba(255, 255, 255, 0.85), transparent),
          radial-gradient(1px 1px at 28% 62%, rgba(255, 255, 255, 0.7), transparent),
          radial-gradient(1.5px 1.5px at 44% 30%, rgba(243, 232, 255, 0.9), transparent),
          radial-gradient(1px 1px at 61% 78%, rgba(255, 255, 255, 0.55), transparent),
          radial-gradient(2px 2px at 73% 22%, rgba(255, 200, 210, 0.75), transparent),
          radial-gradient(1px 1px at 88% 48%, rgba(255, 255, 255, 0.65), transparent),
          radial-gradient(1.5px 1.5px at 8% 84%, rgba(200, 180, 255, 0.7), transparent),
          radial-gradient(1px 1px at 52% 10%, rgba(255, 255, 255, 0.5), transparent);
        background-size: 100% 100%;
        animation: drift 48s linear infinite;
      }

      .stars-2 {
        opacity: 0.35;
        background-image:
          radial-gradient(1px 1px at 16% 40%, #fff, transparent),
          radial-gradient(1px 1px at 36% 88%, #fff, transparent),
          radial-gradient(1px 1px at 58% 54%, #fff, transparent),
          radial-gradient(1px 1px at 79% 14%, #fff, transparent),
          radial-gradient(1px 1px at 93% 71%, #fff, transparent);
        animation: drift 72s linear infinite reverse;
      }

      .brand {
        position: absolute;
        top: clamp(0.75rem, 2.5vh, 1.5rem);
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        width: clamp(5.75rem, 14vw, 9rem);
        aspect-ratio: 1 / 1;
        pointer-events: none;
      }

      .brand__still,
      .brand__lottie {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .brand__still {
        display: block;
        object-fit: contain;
        opacity: 1;
        transition: opacity 0.2s ease;
      }

      .brand.is-ready .brand__still {
        opacity: 0;
        pointer-events: none;
      }

      .brand__lottie {
        opacity: 0;
      }

      .brand.is-ready .brand__lottie {
        opacity: 1;
      }

      .brand__lottie canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      .haze {
        position: absolute;
        inset: -10%;
        z-index: 2;
        pointer-events: none;
        background:
          radial-gradient(circle at 30% 40%, rgba(139, 92, 246, 0.12), transparent 35%),
          radial-gradient(circle at 70% 55%, rgba(200, 16, 46, 0.14), transparent 38%);
        animation: pulse 10s ease-in-out infinite;
      }

      .field {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr;
        gap: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      .star {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        text-decoration: none;
        color: inherit;
        width: 100%;
        height: 100%;
        min-height: 0;
        padding: clamp(1.5rem, 4vw, 3rem);
        border: 0;
        background: transparent;
      }

      .star--poker,
      .star--office {
        justify-self: stretch;
        align-self: stretch;
        margin: 0;
      }

      .star__icon-wrap {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        margin-bottom: 1.25rem;
        width: clamp(6.5rem, 18vw, 11rem);
        height: clamp(6.5rem, 18vw, 11rem);
      }

      .star__icon-wrap::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 160%;
        height: 160%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0.22) 35%,
          rgba(255, 255, 255, 0) 70%
        );
        filter: blur(18px);
        opacity: 0.85;
        pointer-events: none;
        z-index: 0;
        transition: opacity 0.45s var(--ease), transform 0.55s var(--ease), width 0.55s var(--ease),
          height 0.55s var(--ease);
      }

      .star:hover .star__icon-wrap::before,
      .star:focus-visible .star__icon-wrap::before {
        opacity: 1;
        width: 210%;
        height: 210%;
        filter: blur(26px);
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.85) 0%,
          rgba(255, 255, 255, 0.35) 38%,
          rgba(255, 255, 255, 0) 72%
        );
      }

      .star__icon {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: transform 0.4s var(--ease);
      }

      .star:hover .star__icon,
      .star:focus-visible .star__icon {
        transform: scale(1.06);
      }

      .star__name {
        position: relative;
        z-index: 1;
        font-family: Orbitron, sans-serif;
        font-weight: 700;
        font-size: clamp(1.35rem, 3.2vw, 1.85rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 0.7rem;
        color: #ffe4ec;
      }

      .star--office .star__name {
        color: #ede9fe;
      }

      .star__desc {
        position: relative;
        z-index: 1;
        max-width: 16rem;
        font-weight: 300;
        font-size: 1rem;
        line-height: 1.5;
        color: rgba(243, 232, 255, 0.72);
      }

      .star:focus-visible {
        outline: none;
      }

      .star:focus-visible .star__name {
        text-decoration: underline;
        text-underline-offset: 0.3em;
      }

      @keyframes drift {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-40px);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.7;
        }
        50% {
          opacity: 1;
        }
      }

      @media (max-width: 780px) {
        .field {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }

        .star--office,
        .star--poker {
          justify-self: stretch;
          margin: 0;
        }

        .brand {
          width: clamp(5rem, 26vw, 7rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="space">
      <div class="stars" aria-hidden="true"></div>
      <div class="stars-2" aria-hidden="true"></div>
      <div class="haze" aria-hidden="true"></div>

      <header class="brand" id="brand" aria-label="TrueID">
        <img
          class="brand__still"
          src="./assets/tatang-still.png"
          width="280"
          height="280"
          alt="TrueID"
          decoding="async"
          fetchpriority="high"
        />
        <div class="brand__lottie" id="tatang-logo" aria-hidden="true"></div>
      </header>

      <div class="field">
        <a class="star star--office" href="/office/">
          <span class="star__icon-wrap">
            <img class="star__icon" src="./assets/office.svg" width="128" height="128" alt="" />
          </span>
          <span class="star__name">Office</span>
          <span class="star__desc">Virtual workspace — เดินคุย แชร์จอ ในออฟฟิศบล็อก</span>
        </a>

        <a class="star star--poker" href="/poker/">
          <span class="star__icon-wrap">
            <img class="star__icon" src="./assets/poker.svg" width="128" height="128" alt="" />
          </span>
          <span class="star__name">Point Poker</span>
          <span class="star__desc">Realtime story-point voting ผูกกับ Jira boards</span>
        </a>
      </div>
    </main>

    <script src="./assets/lottie.min.js" defer></script>
    <script defer>
      ;(function () {
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var brand = document.getElementById('brand')
        var el = document.getElementById('tatang-logo')
        if (!el || !window.lottie) return

        var LOOP_DELAY_MS = 3000
        var restartTimer = null

        function start(data) {
          var anim = window.lottie.loadAnimation({
            container: el,
            renderer: 'canvas',
            loop: false,
            autoplay: false,
            animationData: data,
            rendererSettings: {
              clearCanvas: true,
              preserveAspectRatio: 'xMidYMid meet',
              dpr: Math.min(window.devicePixelRatio || 1, 1.25),
            },
          })

          anim.setSubframe(false)

          anim.addEventListener('DOMLoaded', function () {
            if (brand) brand.classList.add('is-ready')
            if (!reduced) anim.play()
          })

          anim.addEventListener('complete', function () {
            if (reduced) return
            clearTimeout(restartTimer)
            restartTimer = setTimeout(function () {
              anim.goToAndPlay(0, true)
            }, LOOP_DELAY_MS)
          })
        }

        fetch('./assets/tatang-logo.json')
          .then(function (r) {
            if (!r.ok) throw new Error('lottie fetch failed')
            return r.json()
          })
          .then(start)
          .catch(function () {})
      })()
    </script>
  </body>
</html>
