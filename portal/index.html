<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrueID — Portal</title>
    <meta name="description" content="TrueID internal apps on agent3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #07010f;
        --nebula-a: #2a0640;
        --nebula-b: #6b0f3a;
        --nebula-c: #c8102e;
        --violet: #8b5cf6;
        --mist: #f3e8ff;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        min-height: 100%;
      }

      body {
        font-family: Outfit, system-ui, sans-serif;
        color: var(--mist);
        background: var(--void);
        overflow: hidden;
      }

      .space {
        position: relative;
        width: 100%;
        height: 100dvh;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(ellipse 90% 70% at 18% 25%, rgba(139, 92, 246, 0.28), transparent 55%),
          radial-gradient(ellipse 80% 60% at 82% 70%, rgba(200, 16, 46, 0.32), transparent 52%),
          radial-gradient(ellipse 50% 40% at 50% 50%, rgba(42, 6, 64, 0.9), transparent 70%),
          linear-gradient(160deg, #05010c 0%, #12041f 45%, #1a0518 100%);
      }

      .stars,
      .stars-2 {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-repeat: repeat;
        opacity: 0.55;
      }

      .stars {
        background-image:
          radial-gradient(1.5px 1.5px at 12% 18%, rgba(255, 255, 255, 0.85), transparent),
          radial-gradient(1px 1px at 28% 62%, rgba(255, 255, 255, 0.7), transparent),
          radial-gradient(1.5px 1.5px at 44% 30%, rgba(243, 232, 255, 0.9), transparent),
          radial-gradient(1px 1px at 61% 78%, rgba(255, 255, 255, 0.55), transparent),
          radial-gradient(2px 2px at 73% 22%, rgba(255, 200, 210, 0.75), transparent),
          radial-gradient(1px 1px at 88% 48%, rgba(255, 255, 255, 0.65), transparent),
          radial-gradient(1.5px 1.5px at 8% 84%, rgba(200, 180, 255, 0.7), transparent),
          radial-gradient(1px 1px at 52% 10%, rgba(255, 255, 255, 0.5), transparent);
        background-size: 100% 100%;
        animation: drift 48s linear infinite;
      }

      .stars-2 {
        opacity: 0.35;
        background-image:
          radial-gradient(1px 1px at 16% 40%, #fff, transparent),
          radial-gradient(1px 1px at 36% 88%, #fff, transparent),
          radial-gradient(1px 1px at 58% 54%, #fff, transparent),
          radial-gradient(1px 1px at 79% 14%, #fff, transparent),
          radial-gradient(1px 1px at 93% 71%, #fff, transparent);
        animation: drift 72s linear infinite reverse;
      }

      .logo-bg {
        position: absolute;
        left: 50%;
        top: 46%;
        width: min(92vw, 920px);
        aspect-ratio: 16 / 9;
        transform: translate(-50%, -50%);
        opacity: 0.22;
        filter: saturate(1.15) brightness(1.05);
        pointer-events: none;
        z-index: 1;
        mix-blend-mode: screen;
      }

      .logo-bg__lottie {
        width: 100%;
        height: 100%;
      }

      .haze {
        position: absolute;
        inset: -10%;
        z-index: 2;
        pointer-events: none;
        background:
          radial-gradient(circle at 30% 40%, rgba(139, 92, 246, 0.12), transparent 35%),
          radial-gradient(circle at 70% 55%, rgba(200, 16, 46, 0.14), transparent 38%);
        animation: pulse 10s ease-in-out infinite;
      }

      .brand {
        position: absolute;
        top: clamp(1.4rem, 4vh, 2.8rem);
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        text-align: center;
        pointer-events: none;
      }

      .brand__mark {
        font-family: Orbitron, sans-serif;
        font-weight: 700;
        font-size: clamp(1.15rem, 2.4vw, 1.55rem);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: rgba(243, 232, 255, 0.72);
      }

      .brand__mark span {
        color: #ff4d6d;
      }

      .field {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: grid;
        place-items: center;
        grid-template-columns: 1fr 1fr;
        gap: clamp(1rem, 6vw, 6rem);
        padding: clamp(5rem, 12vh, 8rem) clamp(1.25rem, 6vw, 5rem) clamp(2rem, 6vh, 4rem);
      }

      .star {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        text-decoration: none;
        color: inherit;
        width: min(100%, 22rem);
        padding: 2.5rem 1.5rem;
        border: 0;
        background: transparent;
        isolation: isolate;
        animation: float 7s ease-in-out infinite;
      }

      .star--poker {
        animation-delay: -3.2s;
        justify-self: start;
        margin-top: 8vh;
      }

      .star--office {
        justify-self: end;
        margin-bottom: 6vh;
      }

      .star__glow {
        position: absolute;
        inset: 10% 5%;
        z-index: 0;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(200, 16, 46, 0.35) 0%, transparent 68%);
        filter: blur(28px);
        opacity: 0.75;
        transition: opacity 0.5s var(--ease), transform 0.7s var(--ease);
        pointer-events: none;
      }

      .star--office .star__glow {
        background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, transparent 68%);
      }

      .star:hover .star__glow,
      .star:focus-visible .star__glow {
        opacity: 1;
        transform: scale(1.18);
      }

      .star__mark {
        position: relative;
        z-index: 1;
        width: clamp(4.5rem, 12vw, 6.5rem);
        height: clamp(4.5rem, 12vw, 6.5rem);
        margin-bottom: 1.35rem;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.35), transparent 45%),
          radial-gradient(circle at 50% 50%, rgba(200, 16, 46, 0.55), rgba(42, 6, 64, 0.15) 70%);
        box-shadow: 0 0 40px rgba(200, 16, 46, 0.25);
        transition: transform 0.55s var(--ease);
      }

      .star--office .star__mark {
        background:
          radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.35), transparent 45%),
          radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.55), rgba(42, 6, 64, 0.15) 70%);
        box-shadow: 0 0 40px rgba(139, 92, 246, 0.28);
      }

      .star:hover .star__mark,
      .star:focus-visible .star__mark {
        transform: scale(1.08);
      }

      .star__glyph {
        font-family: Orbitron, sans-serif;
        font-weight: 700;
        font-size: clamp(1.15rem, 3vw, 1.55rem);
        letter-spacing: 0.04em;
        color: #fff;
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
      }

      .star__name {
        position: relative;
        z-index: 1;
        font-family: Orbitron, sans-serif;
        font-weight: 700;
        font-size: clamp(1.35rem, 3.2vw, 1.85rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 0.7rem;
        color: #ffe4ec;
      }

      .star--office .star__name {
        color: #ede9fe;
      }

      .star__desc {
        position: relative;
        z-index: 1;
        max-width: 16rem;
        font-weight: 300;
        font-size: 1rem;
        line-height: 1.5;
        color: rgba(243, 232, 255, 0.72);
      }

      .star:focus-visible {
        outline: none;
      }

      .star:focus-visible .star__name {
        text-decoration: underline;
        text-underline-offset: 0.3em;
      }

      @keyframes drift {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-40px);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) translateX(0);
        }
        50% {
          transform: translateY(-18px) translateX(6px);
        }
      }

      .star--poker {
        animation-name: float-alt;
      }

      @keyframes float-alt {
        0%,
        100% {
          transform: translateY(0) translateX(0);
        }
        50% {
          transform: translateY(-14px) translateX(-10px);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.7;
        }
        50% {
          opacity: 1;
        }
      }

      @media (max-width: 780px) {
        .field {
          grid-template-columns: 1fr;
          gap: 2.5rem;
          padding-top: 6.5rem;
        }

        .star--office,
        .star--poker {
          justify-self: center;
          margin: 0;
        }

        .logo-bg {
          width: 140vw;
          opacity: 0.16;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="space">
      <div class="stars" aria-hidden="true"></div>
      <div class="stars-2" aria-hidden="true"></div>
      <div class="logo-bg" aria-hidden="true">
        <div class="logo-bg__lottie" id="tatang-logo"></div>
      </div>
      <div class="haze" aria-hidden="true"></div>

      <header class="brand">
        <p class="brand__mark">True<span>ID</span></p>
      </header>

      <div class="field">
        <a class="star star--office" href="/office/">
          <span class="star__glow" aria-hidden="true"></span>
          <span class="star__mark" aria-hidden="true"><span class="star__glyph">O</span></span>
          <span class="star__name">Office</span>
          <span class="star__desc">Virtual workspace — เดินคุย แชร์จอ ในออฟฟิศบล็อก</span>
        </a>

        <a class="star star--poker" href="/poker/">
          <span class="star__glow" aria-hidden="true"></span>
          <span class="star__mark" aria-hidden="true"><span class="star__glyph">P</span></span>
          <span class="star__name">Point Poker</span>
          <span class="star__desc">Realtime story-point voting ผูกกับ Jira boards</span>
        </a>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script>
      ;(function () {
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var el = document.getElementById('tatang-logo')
        if (!el || !window.lottie) return
        window.lottie.loadAnimation({
          container: el,
          renderer: 'svg',
          loop: true,
          autoplay: !reduced,
          path: './assets/tatang-logo.json',
        })
      })()
    </script>
  </body>
</html>
